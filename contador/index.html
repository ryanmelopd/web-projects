<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1 id="title">Contador</h1>
        </div>
        <div class="counter">
            <span id="counter-content">0</span>
        </div>
        <div class="buttons">
            <div class="buttons-increase">
            <button id="increase">Aumentar</button>
            <button id="multiply-x2">x2</button>
        </div>
        <div class="buttons-decrease">
            <button id="decrease">Diminuir</button>
            <button id="redefine">Redefinir</button>
        </div>
        </div>
    </div>
</body>
</html>
