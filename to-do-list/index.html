<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>To-Do List</h1>
        </div>
        <div class="content">
            <input type="text" placeholder="Digite uma tarefa" required>
        <button>Adicionar</button>
        <ul>
            <li>Estudar Java</li>
            <li>Estudar JavaScript</li>
            <li>Fazer trabalho</li>
        </ul>
        <button id="bottom-2">Limpar Tarefas</button>
        </div>
    </div>
</body>
</html>
