<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="caixa-formulario">
    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" class="textuais">
        <label for="telefone">Telefone:</label>
        <input type="number" id="telefone" class="textuais">
        <label for="email">E-mail:</label>
        <input type="email" id="email" class="textuais">
        <label>Gênero:</label>
        <div>
            <input type="radio" name="genero" id="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="feminino">
            <label for="feminino">Feminino</label>
        </div>
        <div>
            <input type="checkbox" id="termos">
            <label for="termos">Aceito os termos</label>
        </div>
        <button type="submit">Enviar</button>
    </form>
</div>
<script src="script.js"></script>
</body>
</html>
